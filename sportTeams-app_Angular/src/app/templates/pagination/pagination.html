<div class="pagination" *ngIf="totalPages">

  <button (click)="previous()" [disabled]="currentPage === 1">
    Prev
  </button>

  <button 
    *ngFor="let p of pages()"
    (click)="changePage(p)"
    [class.active]="p === currentPage"
  >
    {{ p }}
  </button>

  <button (click)="next()" [disabled]="currentPage === totalPages">
    Next
  </button>
</div>
